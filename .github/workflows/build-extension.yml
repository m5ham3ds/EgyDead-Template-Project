name: Build Extension APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'
        validate-wrappers: false

    - name: Build Release APK
      run: gradle :app:assembleRelease --stacktrace

    - name: List output files (Debugging)
      run: |
        echo "=========================================="
        echo "🔍 البحث عن جميع ملفات APK في المشروع:"
        find . -name "*.apk" -type f
        echo "=========================================="
        echo "📂 محتويات مجلد release (إن وجد):"
        ls -la app/build/outputs/apk/release/ || echo "❌ المجلد غير موجود"
        echo "=========================================="
        echo "📂 محتويات مجلد outputs (إن وجد):"
        ls -la app/build/outputs/apk/ || echo "❌ المجلد غير موجود"

    - name: Upload Extension APK
      uses: actions/upload-artifact@v4
      with:
        name: EgyDead-Extension-Release
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
